name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure CMake
        run: cmake -B build/release -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -A x64
        shell: pwsh

      - name: Build Release
        run: cmake --build build/release --config Release
        shell: pwsh

      - name: Download Tesseract trained data
        run: |
          New-Item -ItemType Directory -Force -Path "staging/data/tessdata"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata" -OutFile "staging/data/tessdata/eng.traineddata"
        shell: pwsh

      - name: Get version from tag
        id: version
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v') {
            $version = $ref -replace '^v', ''
          } else {
            $version = "0.0.0-dev"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$ref" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Package release
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $releaseDir = "bronco-v${version}-win64"

          # Create release directory structure
          New-Item -ItemType Directory -Force -Path "$releaseDir/config"
          New-Item -ItemType Directory -Force -Path "$releaseDir/data/dictionaries"
          New-Item -ItemType Directory -Force -Path "$releaseDir/data/skilldata"
          New-Item -ItemType Directory -Force -Path "$releaseDir/data/tessdata"
          New-Item -ItemType Directory -Force -Path "$releaseDir/scripts"

          # Copy DLL (find it dynamically since output path varies by generator)
          $dll = Get-ChildItem -Path "build/release" -Recurse -Filter "d3d11.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "d3d11.dll not found in build/release"
            exit 1
          }
          Copy-Item $dll.FullName "$releaseDir/"

          # Copy bronco_ocr.dll (OCR engine DLL loaded at runtime)
          $ocrDll = Get-ChildItem -Path "build/release" -Recurse -Filter "bronco_ocr.dll" | Select-Object -First 1
          if (-not $ocrDll) {
            Write-Error "bronco_ocr.dll not found in build/release"
            exit 1
          }
          Copy-Item $ocrDll.FullName "$releaseDir/"

          # Copy config
          Copy-Item "config/bronco_config.json" "$releaseDir/config/"

          # Copy all dictionaries (all locales)
          Copy-Item "data/dictionaries/*" "$releaseDir/data/dictionaries/" -Recurse

          # Copy skilldata (reconstructed full-tooltip dataset, all locales)
          Copy-Item "data/skilldata/*" "$releaseDir/data/skilldata/" -Recurse

          # Copy tessdata
          Copy-Item "staging/data/tessdata/eng.traineddata" "$releaseDir/data/tessdata/"

          # Copy scripts
          Copy-Item "scripts/install.ps1" "$releaseDir/scripts/"
          Copy-Item "scripts/uninstall.ps1" "$releaseDir/scripts/"
          Copy-Item "scripts/Instalar.bat" "$releaseDir/scripts/"
          Copy-Item "scripts/Desinstalar.bat" "$releaseDir/scripts/"

          # Copy install readme
          Copy-Item "docs/INSTALL.md" "$releaseDir/README_INSTALL.md"

          # Create ZIP
          Compress-Archive -Path "$releaseDir" -DestinationPath "bronco-v${version}-win64.zip"
        shell: pwsh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Bronco ${{ steps.version.outputs.TAG }}"
          body: |
            ## Bronco ${{ steps.version.outputs.TAG }}

            ### Instalacao Rapida

            1. Baixe o arquivo `bronco-v${{ steps.version.outputs.VERSION }}-win64.zip`
            2. Extraia o ZIP em qualquer pasta
            3. De duplo-clique em `scripts/Instalar.bat`

            Para mais detalhes, veja o arquivo `README_INSTALL.md` dentro do ZIP.
          files: "bronco-v${{ steps.version.outputs.VERSION }}-win64.zip"
          draft: false
          prerelease: false
